services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fereloboost}
      POSTGRES_USER: ${POSTGRES_USER:-fereloboost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fereloboost_dev_only}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: 'redis:7.4-alpine'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
